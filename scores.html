  <main class="scores-app">
    <header class="scores-top"><a class="icon-button" href="index.html"><i class="fa-solid fa-chevron-left"></i></a><div><small>ANAWAR HEIN FOOTBALL</small><h1>ရလဒ်များ</h1></div><button class="icon-button" id="scoreRefresh"><i class="fa-solid fa-rotate-right"></i></button></header>
