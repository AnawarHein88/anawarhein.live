<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505">
  <title>Live TV • ANAWAR HEIN Football</title><script src="access-config.js?v=12"></script><script src="guard.js?v=11"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700;800&family=Oswald:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="player.css"><link rel="stylesheet" href="tv.css"><link rel="stylesheet" href="fa-polish.css?v=15">
<link rel="stylesheet" href="universe.css?v=1"></head>
<body>
  <main class="tv-app">
    <header class="tv-top"><a class="icon-button" href="index.html" aria-label="Back"><i class="fa-solid fa-chevron-left"></i></a><div><small>ANAWAR HEIN FOOTBALL</small><h1>Live TV</h1></div><button class="icon-button" id="addChannel"><i class="fa-solid fa-plus"></i></button></header>
    <section class="tv-player"><div class="tv-screen"><video id="tvVideo" controls playsinline autoplay></video><div class="tv-placeholder" id="placeholder"><span><i class="fa-solid fa-play"></i></span><b>Channel တစ်ခုရွေးပါ</b><small>အောက်က channel card ကိုနှိပ်ပြီး ကြည့်ရှုနိုင်ပါတယ်</small></div><div class="tv-loader" id="loader">ချိတ်ဆက်နေပါသည်…</div></div><div class="now-playing"><div class="on-air"><i></i> ON AIR</div><div><b id="nowTitle">ANAWAR HEIN Live TV</b><small id="nowCategory">Choose a channel</small></div><button class="icon-button" id="fullscreen"><i class="fa-solid fa-expand"></i></button></div></section>
    <div class="tv-tools"><label><span><i class="fa-solid fa-magnifying-glass"></i></span><input id="search" type="search" placeholder="Channel ရှာရန်…"></label><div class="categories" id="categories"></div></div>
    <div class="channel-heading"><div><h2>Channels</h2><small id="channelCount">0 channels</small></div><span>Live 24/7</span></div>
    <section class="channel-grid" id="channelGrid"></section>
  </main>

  <nav class="bottom"><a class="nav nav-link" href="index.html"><i class="fa-solid fa-futbol"></i>ဘောလုံး</a><a class="nav nav-link" href="scores.html"><i class="fa-solid fa-chart-simple"></i>ရလဒ်</a><a class="nav nav-link active" href="tv.html"><i class="fa-solid fa-tv"></i>TV</a><a class="nav nav-link" href="sports.html"><i class="fa-solid fa-trophy"></i>အားကစား</a><a class="nav nav-link" href="news.html"><i class="fa-regular fa-newspaper"></i>သတင်း</a><a class="nav nav-link" href="settings.html"><i class="fa-solid fa-gear"></i>ဆက်တင်</a></nav>

  <div class="channel-modal" id="channelModal"><form id="channelForm"><div class="form-head"><div><small>CUSTOM CHANNEL</small><h3>TV Channel ထည့်ရန်</h3></div><button type="button" id="closeForm" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><label>Channel Name<input id="channelName" required placeholder="ဥပမာ — My Sports TV"></label><label>Stream URL<input id="channelUrl" type="url" required placeholder="https://example.com/live.m3u8"></label><label>Logo URL<input id="channelLogo" type="url" placeholder="https://example.com/logo.png"></label><label>Category<select id="channelCategory"><option>Sports</option><option>News</option><option>Entertainment</option><option>Movies</option><option>Other</option></select></label><button class="form-save" type="submit">Channel သိမ်းမည်</button></form></div>
  <div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script><script>document.write('<script src="https://www.aryone.live/channels.js?v='+Date.now()+'"><\/script>')</script><script>window.ANAWARHEIN_DEFAULT_CHANNELS=window.ARYONE_DEFAULT_CHANNELS||[];</script><script src="tv.js?v=2"></script>
</body>
</html>
