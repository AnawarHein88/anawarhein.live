<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Manager • ANAWAR HEIN</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin-codes.css"><link rel="stylesheet" href="fa-polish.css?v=15"><script src="access-config.js?v=10"></script><link rel="stylesheet" href="universe.css?v=1"></head><body><main><header><a href="access.html" aria-label="Back"><i class="fa-solid fa-chevron-left"></i></a><div><small>ANAWAR HEIN ADMIN</small><h1>Access Code Manager</h1></div></header><section id="pinCard" class="card"><h2><i class="fa-solid fa-shield-halved"></i> Admin PIN</h2><p>Default PIN: — `access-config.js` မှာပြောင်းပါ။</p><form id="pinForm"><input id="adminPin" type="password" required placeholder="Admin PIN"><button>ဝင်မည်</button></form></section><section id="manager" class="manager"><div class="warning"><b><i class="fa-solid fa-triangle-exclamation"></i> အခြေခံကာကွယ်မှုသာဖြစ်သည်</b><span>GitHub Pages client-side code ဖြစ်သောကြောင့် လျှို့ဝှက်အချက်အလက်အတွက် မသုံးပါနှင့်။</span></div><form id="codeForm" class="card"><label>Member Name<input id="memberName" required placeholder="Ko Aung"></label><div class="row"><label>အချိန်<input id="durationValue" type="number" min="1" value="1"></label><label>Unit<select id="durationUnit"><option value="60">Minutes</option><option value="3600">Hours</option><option value="86400" selected>Days</option><option value="604800">Weeks</option></select></label></div><button class="generate"><i class="fa-solid fa-key"></i> Code ဖန်တီးမည်</button></form><section id="codeResult" class="result"><small>GENERATED CODE</small><textarea id="generatedCode" readonly></textarea><button id="copyGenerated" type="button"><i class="fa-regular fa-copy"></i> Copy Code</button><span id="expiryText"></span></section><h2>Code History</h2><div id="codeHistory"></div></section></main><script src="admin-codes.js"></script></body></html>
